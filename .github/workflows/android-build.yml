name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # v4 no longer requests Google's removed "tools" SDK package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          command -v sdkmanager
          sdkmanager --version

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Validate Gradle configuration
        run: gradle --no-daemon tasks --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK exists
        if: success()
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileMaster-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish permanent GitHub Release download
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-dev.${{ github.run_number }}
          name: FileMaster Development Build ${{ github.run_number }}
          body: |
            Development/debug APK for FileMaster by Ahmedbecett.

            **Work in progress:** This is a development build, not a production release. Test carefully and back up important files.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          make_latest: true

      - name: Upload build reports for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FileMaster-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
